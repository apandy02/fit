# .pre-commit-config.yaml

repos:
  # UV integration: update uv.lock and export to requirements.txt
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.29  # use the desired uv version
    hooks:
      - id: uv-lock       # ensures that your uv.lock file is updated if pyproject.toml changes
      - id: uv-export     # (optional) automatically exports uv.lock to requirements.txt

  # Local hooks to run Python linters via uv
  - repo: local
    hooks:
      - id: ruff-check
        name: "Run Ruff Linter via uv"
        entry: uv run ruff check
        language: system
        files: \.py$
      - id: isort-check
        name: "Run isort via uv (check mode)"
        # You can change '--check-only' to '--diff' or remove it if you want auto‑fixing
        entry: uv run isort --check-only
        language: system
        files: \.py$
