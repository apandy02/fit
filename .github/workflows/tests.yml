name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: astral/uv:latest
      env:
        UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v3
      - name: Sync project environment for testing
        run: uv sync --all-extras --dev
      - name: Run Tests
        run: uv run python -m unittest discover -v
