name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    steps:
      - uses: actions/checkout@v3
      - name: Run Ruff Linter
        run: uvx run ruff check .
