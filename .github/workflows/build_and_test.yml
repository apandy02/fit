name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    steps:
      - uses: actions/checkout@v3
      - name: Sync project environment for testing
        run: uv sync --all-extras --dev
      - name: Dry Run Build
        run: uv build --dry-run
      - name: Run Tests
        run: uv run python -m unittest discover -v
