[project]
name = "fit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.3.2",
    "fitbit-web-api>=0.2.0",
    "ipython>=8.29.0",
    "jupyter>=1.1.1",
    "markdown>=3.7",
    "plotly>=5.24.1",
    "pydantic>=2.11.7",
    "requests>=2.32.3",
    "cherrypy>=18.10.0",
    "pandas>=2.2.3",
    "pre-commit>=4.1.0",
    "coverage>=7.6.12",
    "fastapi>=0.111.1",
    "uvicorn>=0.30.6",
    "pillow>=10.4.0",
    "psycopg[binary]>=3.2.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic-ai>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/fit"]
