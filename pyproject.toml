[project]
name = "fit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "authlib>=1.3.2",
    "ell-ai[all]>=0.0.15",
    "fh-bootstrap>=0.0.3",
    "fitbit>=0.3.1",
    "fitbit-web-api>=0.2.0",
    "ipython>=8.29.0",
    "isort>=5.13.2",
    "jupyter>=1.1.1",
    "markdown>=3.7",
    "plotly>=5.24.1",
    "pydantic>=2.10.4",
    "python-fasthtml>=0.10.1",
    "requests>=2.32.3",
    "ruff>=0.7.3",
    "cherrypy>=18.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
